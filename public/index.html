<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iDroid">
  <meta name="description" content="An iPhone-first personal music player with permanent Railway storage.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/pwa/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./assets/images/music.png">
  <link rel="stylesheet" href="./assets/css/styles.css">
  <title>iDroid</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>

  <audio id="audio" preload="auto" playsinline></audio>
  <audio id="audioStandby" preload="auto" playsinline aria-hidden="true"></audio>
  <input id="trackPicker" class="visually-hidden" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.aiff,.aif,.flac,.ogg,.oga,.opus,.caf,.mp4,.m4b" multiple>
  <input id="imagePicker" class="visually-hidden" type="file" accept="image/*">

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive" aria-atomic="true"></div>

  <script src="./assets/js/app.js" defer></script>
</body>
</html>

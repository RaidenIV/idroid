<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151515">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="iDroid">
  <meta name="description" content="An iPhone-first local music player that plays audio selected from your device without uploading it.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icon-32.png">
  <link rel="stylesheet" href="./styles.css">
  <title>iDroid</title>
</head>
<body>
  <div id="app" class="app-shell" aria-live="polite"></div>

  <audio id="audio" preload="metadata"></audio>
  <input id="trackPicker" class="visually-hidden" type="file" accept="audio/*" multiple>
  <input id="imagePicker" class="visually-hidden" type="file" accept="image/*">

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive" aria-atomic="true"></div>

  <script src="./app.js" defer></script>
</body>
</html>
